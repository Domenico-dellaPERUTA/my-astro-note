services:
  app:
    image: node:22.14.0-alpine
    container_name: my-astro-app
    restart: unless-stopped
    volumes:
      - ./dist:/workspace/dist:ro                              # build compilata di Astro
      - ./node_modules:/workspace/node_modules:ro             # dipendenze di produzione
      - ./dist/client/WebApp:/workspace/dist/client/WebApp:ro # asset WebApp (sovrascrive il mount dist/)
    working_dir: /workspace
    command: node dist/server/entry.mjs
    ports:
      - "4321:4321"
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=appunti_db
      - DB_USER=root
      - DB_PASSWORD=Orione___
      - WEBAPP_PATH=/workspace/dist/client/WebApp
    networks:
      - proxy_net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    container_name: my-astro-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: appunti_db
      MARIADB_ROOT_PASSWORD: Orione___
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - proxy_net
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: my-astro-adminer
    restart: unless-stopped
    ports:
      - "8089:8080"
    networks:
      - proxy_net
    depends_on:
      - db

networks:
  proxy_net:
    external: true
    name: proxy_net

volumes:
  db_data:
